<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Survival Game: Natural Forest Ecology</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <div id="debug-panel">
      <div>🌍 Экосистема: <span id="info-biome" class="biome-tag">Кедрово-сосновый бор</span></div>
      <div>📍 Координаты: <span id="info-coords" class="badge">X: 0, Y: 0</span></div>
      <div>🌲 Деревьев в кадре: <span id="info-trees" class="badge">0</span></div>
    </div>

    <div id="minimap">
      <span>ЛЕС</span>
      <span style="font-size: 8px; color: #2ecc71;">ЭКОЛОГИЯ</span>
    </div>

    <div id="joystick-hint">Касание в левой нижней зоне для перемещения</div>
  </div>

  <!-- Порядок важен: config -> assets грузит по этим спискам, world/player/
       input друг от друга не зависят, render использует все предыдущие,
       main запускает игровой цикл и должен идти последним. -->
  <script src="src/ground.js?v=16"></script>
  <script src="src/config.js?v=16"></script>
  <script src="src/assets.js?v=16"></script>
  <script src="src/world.js?v=16"></script>
  <script src="src/player.js?v=16"></script>
  <script src="src/input.js?v=16"></script>
  <script src="src/render.js?v=16"></script>
  <script src="src/main.js?v=16"></script>
</body>
</html>

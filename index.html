<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Survival Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #151815;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud-left {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      font-size: 13px;
      pointer-events: none;
      text-shadow: 1px 1px 3px #000;
    }
    .bar-container {
      width: 150px;
      height: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #555;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-hp {
      width: 100%;
      height: 100%;
      background: #e74c3c;
    }
    #hud-right {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }
    .res-badge {
      background: rgba(20, 24, 20, 0.85);
      border: 1px solid #3e4a3a;
      border-radius: 12px;
      padding: 4px 10px;
      color: #eee;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #action-btn {
      position: absolute;
      right: 25px;
      bottom: 25px;
      width: 75px;
      height: 75px;
      background: radial-gradient(circle, #e67e22, #d35400);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      color: white;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      touch-action: manipulation;
    }
    #action-btn:active {
      transform: scale(0.92);
      filter: brightness(1.2);
    }
  </style>
</head>
<body>

  <div id="hud-left">
    <div><strong>Выживший</strong></div>
    <div class="bar-container">
      <div class="bar-hp" id="hp-bar"></div>
    </div>
  </div>

  <div id="hud-right">
    <div class="res-badge">🪵 Дерево: <span id="res-wood">0</span></div>
    <div class="res-badge">🪨 Камень: <span id="res-stone">0</span></div>
    <div class="res-badge">📦 Припасы: <span id="res-supplies">0</span></div>
  </div>

  <div id="action-btn">
    <span style="font-size: 18px;">⛏️</span>
    <span>ДОБЫЧА</span>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const TILE_W = 64;
    const TILE_H = 32;
    const MAP_SIZE = 26;

    const inventory = { wood: 0, stone: 0, supplies: 0 };
    function updateHUD() {
      document.getElementById('res-wood').textContent = inventory.wood;
      document.getElementById('res-stone').textContent = inventory.stone;
      document.getElementById('res-supplies').textContent = inventory.supplies;
    }

    const player = {
      x: 13,
      y: 13,
      speed: 4.2,
      radius: 12,
      angle: 0,
      isActing: false
    };

    const camera = { x: 0, y: 0 };

    function toScreen(x, y) {
      return {
        x: (x - y) * (TILE_W / 2) - camera.x + canvas.width / 2,
        y: (x + y) * (TILE_H / 2) - camera.y + canvas.height / 2
      };
    }

    const sprites = {
      tree: new Image(),
      rock: new Image(),
      crate: new Image()
    };
    sprites.tree.src = 'https://image.pollinations.ai/prompt/isometric%20stylized%20pine%20tree%20game%20sprite%20isolated%20on%20black%20background?width=128&height=128&nologo=true&seed=42';
    sprites.rock.src = 'https://image.pollinations.ai/prompt/isometric%20stylized%20boulder%20rock%20stone%20game%20sprite%20isolated%20on%20black%20background?width=128&height=128&nologo=true&seed=101';
    sprites.crate.src = 'https://image.pollinations.ai/prompt/isometric%20wooden%20crate%20supply%20box%20isolated%20on%20black%20background?width=128&height=128&nologo=true&seed=202';

    const entities = [];
    const resourceTypes = [
      { type: 'tree', count: 18, name: 'Дерево', res: 'wood', hp: 3 },
      { type: 'rock', count: 12, name: 'Камень', res: 'stone', hp: 4 },
      { type: 'crate', count: 6, name: 'Ящик', res: 'supplies', hp: 2 }
    ];

    resourceTypes.forEach(config => {
      for (let i = 0; i < config.count; i++) {
        let rx, ry;
        do {
          rx = Math.floor(Math.random() * (MAP_SIZE - 4)) + 2;
          ry = Math.floor(Math.random() * (MAP_SIZE - 4)) + 2;
        } while (Math.hypot(rx - player.x, ry - player.y) < 3);

        entities.push({
          type: config.type,
          name: config.name,
          res: config.res,
          x: rx,
          y: ry,
          hp: config.hp,
          maxHp: config.hp,
          wobble: 0
        });
      }
    });

    const floatingTexts = [];
    function spawnFloatingText(text, x, y, color = '#2ecc71') {
      floatingTexts.push({ text, x, y, life: 1.0, color });
    }

    const joystick = {
      touchId: null,
      active: false,
      baseX: 0,
      baseY: 0,
      currentX: 0,
      currentY: 0,
      maxRadius: 45,
      deltaX: 0,
      deltaY: 0
    };

    window.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.clientX < canvas.width / 2 && !joystick.active) {
          joystick.touchId = touch.identifier;
          joystick.active = true;
          joystick.baseX = touch.clientX;
          joystick.baseY = touch.clientY;
          joystick.currentX = touch.clientX;
          joystick.currentY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joystick.touchId) {
          const dx = touch.clientX - joystick.baseX;
          const dy = touch.clientY - joystick.baseY;
          const dist = Math.hypot(dx, dy);

          if (dist > joystick.maxRadius) {
            joystick.currentX = joystick.baseX + (dx / dist) * joystick.maxRadius;
            joystick.currentY = joystick.baseY + (dy / dist) * joystick.maxRadius;
          } else {
            joystick.currentX = touch.clientX;
            joystick.currentY = touch.clientY;
          }

          joystick.deltaX = (joystick.currentX - joystick.baseX) / joystick.maxRadius;
          joystick.deltaY = (joystick.currentY - joystick.baseY) / joystick.maxRadius;
        }
      }
    }, { passive: false });

    function resetJoystick() {
      joystick.active = false;
      joystick.touchId = null;
      joystick.deltaX = 0;
      joystick.deltaY = 0;
    }

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystick.touchId) resetJoystick();
      }
    });
    window.addEventListener('touchcancel', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystick.touchId) resetJoystick();
      }
    });

    const actionBtn = document.getElementById('action-btn');
    function performAction() {
      player.isActing = true;
      setTimeout(() => player.isActing = false, 180);

      let closestEntity = null;
      let minDistance = 1.6;

      entities.forEach((ent) => {
        const dist = Math.hypot(ent.x - player.x, ent.y - player.y);
        if (dist < minDistance) {
          minDistance = dist;
          closestEntity = ent;
        }
      });

      if (closestEntity) {
        closestEntity.hp -= 1;
        closestEntity.wobble = 0.25;

        inventory[closestEntity.res] += 1;
        updateHUD();

        const sPos = toScreen(closestEntity.x, closestEntity.y);
        spawnFloatingText(`+1 ${closestEntity.name}`, sPos.x, sPos.y - 20, '#f1c40f');

        if (closestEntity.hp <= 0) {
          const idx = entities.indexOf(closestEntity);
          if (idx !== -1) entities.splice(idx, 1);
        }
      }
    }

    actionBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      performAction();
    }, { passive: false });

    let lastTime = performance.now();
    function update(dt) {
      if (joystick.active) {
        const isoX = joystick.deltaX + joystick.deltaY;
        const isoY = joystick.deltaY - joystick.deltaX;

        player.x += isoX * player.speed * dt;
        player.y += isoY * player.speed * dt;

        player.x = Math.max(1, Math.min(MAP_SIZE - 1, player.x));
        player.y = Math.max(1, Math.min(MAP_SIZE - 1, player.y));

        player.angle = Math.atan2(joystick.deltaY, joystick.deltaX);
      }

      const targetCam = {
        x: (player.x - player.y) * (TILE_W / 2),
        y: (player.x + player.y) * (TILE_H / 2)
      };
      camera.x += (targetCam.x - camera.x) * 0.1;
      camera.y += (targetCam.y - camera.y) * 0.1;

      entities.forEach(ent => {
        if (ent.wobble > 0) ent.wobble = Math.max(0, ent.wobble - dt * 2);
      });

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= dt * 30;
        ft.life -= dt * 1.2;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < MAP_SIZE; x++) {
        for (let y = 0; y < MAP_SIZE; y++) {
          const pt = toScreen(x, y);
          if (pt.x < -TILE_W || pt.x > canvas.width + TILE_W || pt.y < -TILE_H || pt.y > canvas.height + TILE_H) continue;

          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
          ctx.lineTo(pt.x + TILE_W / 2, pt.y + TILE_H / 2);
          ctx.lineTo(pt.x, pt.y + TILE_H);
          ctx.lineTo(pt.x - TILE_W / 2, pt.y + TILE_H / 2);
          ctx.closePath();

          ctx.fillStyle = (x + y) % 2 === 0 ? '#2d3824' : '#27311f';
          ctx.fill();
          ctx.strokeStyle = '#1e2618';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }

      const renderQueue = [
        ...entities.map(e => ({ isPlayer: false, data: e, depth: e.x + e.y })),
        { isPlayer: true, data: player, depth: player.x + player.y }
      ];
      renderQueue.sort((a, b) => a.depth - b.depth);

      renderQueue.forEach(item => {
        if (item.isPlayer) {
          const pPos = toScreen(player.x, player.y);

          ctx.beginPath();
          ctx.ellipse(pPos.x, pPos.y + 8, 12, 6, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(pPos.x, pPos.y - (player.isActing ? 4 : 0), player.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#3498db';
          ctx.fill();
          ctx.strokeStyle = '#1f618d';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(pPos.x, pPos.y);
          ctx.lineTo(
            pPos.x + Math.cos(player.angle) * 18,
            pPos.y + Math.sin(player.angle) * 18
          );
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.stroke();

        } else {
          const ent = item.data;
          const pos = toScreen(ent.x, ent.y);
          const wobbleOffset = Math.sin(Date.now() * 0.05) * (ent.wobble * 8);

          ctx.beginPath();
          ctx.ellipse(pos.x, pos.y + 4, 16, 8, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.fill();

          const sprite = sprites[ent.type];
          if (sprite && sprite.complete && sprite.naturalWidth !== 0) {
            ctx.drawImage(sprite, pos.x - 32 + wobbleOffset, pos.y - 56, 64, 64);
          } else {
            if (ent.type === 'tree') {
              ctx.fillStyle = '#1e8449';
              ctx.beginPath();
              ctx.moveTo(pos.x + wobbleOffset, pos.y - 48);
              ctx.lineTo(pos.x + 18 + wobbleOffset, pos.y);
              ctx.lineTo(pos.x - 18 + wobbleOffset, pos.y);
              ctx.closePath();
              ctx.fill();
            } else if (ent.type === 'rock') {
              ctx.fillStyle = '#7f8c8d';
              ctx.beginPath();
              ctx.arc(pos.x + wobbleOffset, pos.y - 10, 14, 0, Math.PI * 2);
              ctx.fill();
            } else if (ent.type === 'crate') {
              ctx.fillStyle = '#d35400';
              ctx.fillRect(pos.x - 12 + wobbleOffset, pos.y - 20, 24, 20);
            }
          }

          if (ent.hp < ent.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(pos.x - 14, pos.y - 52, 28, 5);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(pos.x - 14, pos.y - 52, (ent.hp / ent.maxHp) * 28, 5);
          }
        }
      });

      floatingTexts.forEach(ft => {
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 13px sans-serif';
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ctx.globalAlpha = 1.0;
      });

      if (joystick.active) {
        ctx.beginPath();
        ctx.arc(joystick.baseX, joystick.baseY, joystick.maxRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(joystick.currentX, joystick.currentY, 20, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fill();
      }
    }

    function gameLoop(time) {
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>

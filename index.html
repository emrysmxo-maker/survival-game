<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Survival Game: Realistic Trees</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <!-- Кнопки выбора реалистичных живых деревьев без аниме -->
    <div id="biome-bar">
      <button class="biome-btn active" data-style="0">🌲 1. Сосна</button>
      <button class="biome-btn" data-style="1">🌳 2. Дуб</button>
      <button class="biome-btn" data-style="2">🪵 3. Берёза</button>
      <button class="biome-btn" data-style="3">🍁 4. Клён</button>
      <button class="biome-btn" data-style="4">⚡ 5. Сухостой</button>
    </div>

    <div class="hint-bar">Нажимайте кнопки для переключения деревьев (без аниме)</div>
  </div>

  <script src="src/camera.js"></script>
  <script src="src/world.js"></script>
  <script src="src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Просим браузер вообще не кэшировать саму страницу — при каждом
       заходе она должна перекачиваться заново. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Survival Game: Natural Forest Ecology</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c120c">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icons/icon-192.png">
  <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
  <script>if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <div id="debug-panel">
      <div>🌍 Экосистема: <span id="info-biome" class="biome-tag">Кедрово-сосновый бор</span></div>
      <div>📍 Координаты: <span id="info-coords" class="badge">X: 0, Y: 0</span></div>
      <div>🌲 Деревьев в кадре: <span id="info-trees" class="badge">0</span></div>
    </div>

    <div id="minimap"><canvas id="minimap-canvas" width="180" height="180"></canvas></div>
    <div id="bigmap"><canvas id="bigmap-canvas"></canvas><div id="bigmap-legend">
      <span style="color:#4a7a8c">■</span> ручей · <span style="color:#4b5a34">■</span> болото ·
      <span style="color:#a7b56a">■</span> поляна · <span style="color:#8a8a80">■</span> камни ·
      <span style="color:#c9a86a">■</span> тропа · <span style="color:#e04030">●</span> зомби<br>
      Нажмите, чтобы закрыть</div></div>

    <div id="zombie-btn">ЗОМБИ +</div>
    <div id="auto-btn">АВТО<br>ОГОНЬ</div>

    <div id="style-bar">
      <div class="style-title">Стрельба:</div>
      <div class="style-grid"><div class="style-btn" data-style="1">1</div><div class="style-btn" data-style="2">2</div><div class="style-btn" data-style="3">3</div><div class="style-btn" data-style="4">4</div><div class="style-btn" data-style="5">5</div><div class="style-btn" data-style="6">6</div><div class="style-btn" data-style="7">7</div><div class="style-btn" data-style="8">8</div><div class="style-btn" data-style="9">9</div><div class="style-btn" data-style="10">10</div></div>
      <div id="style-name"></div>
    </div>

    <div id="fire-btn"><div id="fire-knob"></div><span>ОГОНЬ</span></div>

    <div id="rot-btn">↻ две руки: горизонтально</div>
    <div id="version-tag"></div>
    <div id="joystick-hint">Касание в левой нижней зоне для перемещения</div>
  </div>

  <!-- Three.js и загрузчик 3D-моделей GLTF для персонажа -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/GLTFLoader.js"></script>

  <script>
    // Кэш-бастинг больше не завязан на то, что кто-то не забудет вручную
    // поднять номер версии в этом файле — версия берётся из текущего
    // времени, поэтому при каждом заходе на страницу все .js-файлы
    // и картинки (ASSET_VERSION в src/config.js читает это же значение)
    // гарантированно перекачиваются заново, а не берутся из кэша.
    window.BUILD_VERSION = Date.now();
    // Порядок важен: config -> assets грузит по этим спискам, world/player/
    // input друг от друга не зависят, render использует все предыдущие,
    // main запускает игровой цикл и должен идти последним.
    // document.write гарантирует, что скрипты подключатся и выполнятся
    // строго по порядку, как обычные <script> теги.
    ['version', 'ground', 'config', 'sprites-data', 'assets', 'character', 'cover', 'effects', 'daynight', 'world', 'player', 'weapon', 'zombie', 'minimap', 'input', 'render', 'update', 'main', 'perf', 'viewfix'].forEach((name) => {
      document.write(`<script src="src/${name}.js?v=${window.BUILD_VERSION}"><\/script>`);
    });
  </script>
</body>
</html>

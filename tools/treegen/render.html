<script type="module">
import * as THREE from 'three';
import { Tree, TreePreset } from '@dgreenheck/ez-tree';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const gltfCache={};
window.loadGlb=(url)=>new Promise((res,rej)=>new GLTFLoader().load(url,g=>{gltfCache[url]=g.scene;res(true)},undefined,rej));
window.THREE=THREE; window.Tree=Tree; window.TreePreset=TreePreset;
window.ready=true;
// Рендер одного дерева под камеру игры. spec: {preset, opts:{path:value}, height (м), seed}
const CW=360, CH=720, SS=2;       // холст спрайта и суперсэмплинг
const PPM=63.2;                  // px холста на метр (как у бойца: 32.5 px/м на экране)
window.renderTree=function(spec){
  const elev=spec.elev ?? Math.asin(54/74);
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  r.setSize(CW*SS,CH*SS); r.setClearColor(0x000000,0);
  r.outputColorSpace=THREE.SRGBColorSpace;
  r.localClippingEnabled=true; r.clippingPlanes=[new THREE.Plane(new THREE.Vector3(0,1,0),1.2)]; if(spec.clipTop) r.clippingPlanes.push(new THREE.Plane(new THREE.Vector3(0,-1,0),spec.clipTop));
  r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFShadowMap;
  const sc=new THREE.Scene();
  let tree;
  if(spec.glb){
    tree=gltfCache[spec.glb].clone(true);
    const bb0=new THREE.Box3().setFromObject(tree); const c0=bb0.getCenter(new THREE.Vector3());
    tree.position.set(-c0.x,-bb0.min.y,-c0.z);
    const g=new THREE.Group(); g.add(tree); tree=g;
    tree.traverse(n=>{ if(n.isMesh&&n.material){ n.material.side=THREE.DoubleSide; if(spec.tint) n.material.color.multiply(new THREE.Color(spec.tint)); }});
  } else {
  tree=new Tree();
  const o=TreePreset[spec.preset] ? structuredClone(TreePreset[spec.preset]) : tree.options;
  Object.assign(tree.options,o);
  tree.options.seed=spec.seed??1;
  for(const [p,v] of Object.entries(spec.opts||{})){
    const ks=p.split('.'); let t=tree.options; for(let i=0;i<ks.length-1;i++) t=t[ks[i]]; t[ks[ks.length-1]]=v;
  }
  tree.generate();
  }
  tree.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; if(spec.clipTop&&n.material){ n.material.side=THREE.DoubleSide; } }});
  // масштаб под нужную высоту
  const bb=new THREE.Box3().setFromObject(tree);
  const size=bb.getSize(new THREE.Vector3());
  const maxW=(spec.maxW||5.2);
  const s=Math.min(spec.height/size.y, maxW/Math.max(size.x,size.z));
  tree.scale.setScalar(s);
  bb.setFromObject(tree);
  tree.position.set(-(bb.min.x+bb.max.x)/2*0 , -bb.min.y, 0); // основание на y=0
  const holder=new THREE.Group(); holder.add(tree); sc.add(holder);
  holder.rotation.y=spec.rot||0;
  sc.add(new THREE.HemisphereLight(0xdfe9ff,0x6b5a3a,spec.hemi??1.15));
  const dl=new THREE.DirectionalLight(0xfff2d8,spec.sun??3.2);
  dl.position.set(-6,10,5); dl.castShadow=true; dl.shadow.mapSize.set(2048,2048);
  Object.assign(dl.shadow.camera,{left:-12,right:12,top:14,bottom:-4,near:1,far:40}); dl.shadow.bias=-0.0006;
  sc.add(dl);
  const R=30;
  const wM=CW*SS/(PPM*SS)/1, hM=CH/PPM;
  const cam=new THREE.OrthographicCamera(-wM/2,wM/2, 0.9*hM, -0.1*hM, 0.1, 100);
  cam.position.set(0,R*Math.sin(elev),R*Math.cos(elev)); cam.lookAt(0,0,0);
  r.render(sc,cam);
  const url=r.domElement.toDataURL('image/png');
  r.dispose();
  return url;
};
</script>

name: Build Android APK (TWA Bubblewrap)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'manifest.webmanifest'
      - 'twa-manifest.json'
      - 'src/**'
      - 'index.html'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed TWA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK environment
        run: |
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platforms;android-35" > /dev/null
          # Bubblewrap проверяет старую папку SDK «tools» — без неё «androidSdk isn't correct»
          ln -sfn $SDK/cmdline-tools/latest $SDK/tools

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap paths
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          }
          EOF

      - name: Use repository signing key
        run: |
          # постоянный ключ из репозитория: APK одной подписи обновляется поверх установленного
          cp android/android.keystore android.keystore

      - name: Generate Android Project with Bubblewrap
        run: |
          V=$(grep -oP "GAME_VERSION = '\K[0-9.]+" src/version.js)
          echo "version $V"
          printf "$V\n" | bubblewrap update --skipPwaValidation

      - name: Verify Hardware Acceleration in AndroidManifest
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            if ! grep -q "android:hardwareAccelerated" app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<application android:hardwareAccelerated="true"/g' app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Build Signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: survivalpass123
          BUBBLEWRAP_KEY_PASSWORD: survivalpass123
        run: |
          export BUBBLEWRAP_KEYSTORE_PASSWORD=survivalpass123
          export BUBBLEWRAP_KEY_PASSWORD=survivalpass123
          printf "survivalpass123\nsurvivalpass123\n" | bubblewrap build --skipPwaValidation
          mkdir -p output-apk
          cp app-release-signed.apk output-apk/survival-game.apk
          ls -la output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: survival-game-twa-apk
          path: output-apk/*.apk
          retention-days: 30

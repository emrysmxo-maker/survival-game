name: Build Godot APK

on:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (build-tools 34, platform 34)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" "cmdline-tools;latest" >/dev/null

      - name: Godot + export templates
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates ~/.config/godot
          cd ~/godot
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sL -o tpz.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q tpz.zip && mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.tres

      - name: Модели устарели? (скрипты Blender менялись, а .glb нет)
        id: models
        run: echo "stale=$(bash tools/ci/models.sh check | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.models.outputs.stale != ''
        id: py
        with:
          python-version: "3.13"

      - name: Кэш Blender/текстур
        if: steps.models.outputs.stale != ''
        uses: actions/cache@v4
        with:
          path: |
            /tmp/claude-0/godot
            /tmp/claude-0/blender
            /tmp/claude-0/props/tex
            /tmp/claude-0/houses
            /tmp/claude-0/trees/dl
          key: tools-${{ steps.py.outputs.python-version }}-${{ hashFiles('tools/ci/setup.sh', 'tools/ci/*.py', 'tools/props/tex.py', 'tools/houses/get_tex.py') }}

      - name: Пересборка моделей в Blender
        if: steps.models.outputs.stale != ''
        env:
          PYTHON313: ${{ steps.py.outputs.python-path }}
          GODOT: /home/runner/godot/godot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libxxf86vm1 libxfixes3 libegl1 >/dev/null
          bash tools/ci/setup.sh
          for m in ${{ steps.models.outputs.stale }}; do bash tools/ci/task.sh $m; done
          bash tools/ci/models.sh stamp

      - name: Import and export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/android.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: survivalgame
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: survivalpass123
        run: |
          cd godot
          # версия в углу экрана = номер сборки + коммит (вручную менять не нужно)
          sed -i "s/^const VERSION := .*/const VERSION := \"сборка ${{ github.run_number }} · ${GITHUB_SHA::7}\"/" scripts/hud.gd
          # номер сборки для обновления «по воздуху»: build.txt — в APK и в code.pck; apk_build.txt — только в APK
          echo "${{ github.run_number }}" > build.txt
          echo "${{ github.run_number }}" > apk_build.txt
          mkdir -p build
          ~/godot/godot --headless --path . --import || true
          # не выпускать сломанную сборку: все скрипты и шейдеры должны разбираться
          ~/godot/godot --headless --path . -s res://scripts/parsecheck.gd 2>&1 | tee /tmp/parse.log | tail -20
          grep -q "PARSECHECK ok" /tmp/parse.log
          ~/godot/godot --headless --path . --export-release "Android" build/survival-godot.apk
          # маленький пакет с кодом (скрипты, шейдеры, сцены): игра на телефоне докачивает его сама
          ~/godot/godot --headless --path . --export-pack "Code" build/code.pck
          SIZE=$(stat -c%s build/code.pck)
          APKMIN=$(cat apk_min.txt | tr -d '[:space:]')
          # модели пересобраны в этой сборке — старым APK нужен новый APK
          if [ -n "${{ steps.models.outputs.stale }}" ]; then APKMIN=${{ github.run_number }}; fi
          echo "{\"build\":${{ github.run_number }},\"sha\":\"${GITHUB_SHA::7}\",\"size\":$SIZE,\"apk_min\":${APKMIN:-0}}" > build/update.json
          cat build/update.json
          ls -la build

      - name: Publish APK to GitHub Release (godot-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # APK больше 100 МБ — в репозиторий не помещается, выкладываем в «Releases»
          gh release view godot-latest >/dev/null 2>&1 || gh release create godot-latest --title "Survival (Godot) — последняя сборка" --notes "Автосборка из main. Скачать: survival-godot.apk"
          gh release upload godot-latest godot/build/survival-godot.apk --clobber
          # сначала пакет, потом update.json: игра не увидит новую версию, пока пакет не загружен
          gh release upload godot-latest godot/build/code.pck --clobber
          gh release upload godot-latest godot/build/update.json --clobber
          gh release edit godot-latest --notes "Последняя сборка: №${{ github.run_number }}, коммит ${GITHUB_SHA::7}, $(date -u '+%d.%m %H:%M') UTC. Скачать: survival-godot.apk. Эта же надпись («сборка № · коммит») в углу экрана игры."

      - uses: actions/upload-artifact@v4
        with:
          name: survival-godot-apk
          path: godot/build/survival-godot.apk

name: Remote Godot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remote-godot.yml'
      - 'godot/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libasound2
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin
          mv godot-bin/Godot_v4.3-stable_linux.x86_64 godot-bin/godot
          chmod +x godot-bin/godot
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-godot-output
          godot --headless --version > remote-godot-output/version.txt
          timeout 600 godot --headless --editor --path godot --import 2>&1 | tee remote-godot-output/import.log
      - name: Validate scripts and shaders
        shell: bash
        run: |
          set -euo pipefail
          test -f godot/scripts/parsecheck.gd
          timeout 180 godot --headless --path godot --script res://scripts/parsecheck.gd 2>&1 | tee remote-godot-output/parsecheck.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error|PARSE FAIL|Shader compilation failed' remote-godot-output/import.log remote-godot-output/parsecheck.log; then
            echo 'Godot validation failed: error found in logs.'
            exit 1
          fi
          grep -q '^PARSECHECK ok$' remote-godot-output/parsecheck.log
      - name: Publish result for connector access
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remote-godot-output
          {
            printf '# Remote Godot result\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Run: %s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Status before publication: %s\n\n' "$RESULT_STATUS"
            printf 'Scope: resource import and existing parsecheck.gd; no gameplay test or APK export.\n\n'
            for name in version.txt import.log parsecheck.log; do
              if [ -f "remote-godot-output/$name" ]; then
                printf '\n## %s\n```text\n' "$name"
                tail -n 80 "remote-godot-output/$name"
                printf '\n```\n'
              fi
            done
          } > remote-godot-output/summary.md
          (cd remote-godot-output && zip -q "$RUNNER_TEMP/remote-godot-results.zip" ./*)
          if ! gh release view remote-godot-results >/dev/null 2>&1; then
            gh release create remote-godot-results --target "$GITHUB_SHA" --title 'Remote Godot results (technical)' --prerelease --latest=false --notes 'Results publication pending.'
          fi
          gh release upload remote-godot-results "$RUNNER_TEMP/remote-godot-results.zip" --clobber
          gh release edit remote-godot-results --prerelease --latest=false --notes-file remote-godot-output/summary.md
      - name: Save full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-godot-${{ github.run_number }}
          path: remote-godot-output/
          retention-days: 3
          if-no-files-found: warn
